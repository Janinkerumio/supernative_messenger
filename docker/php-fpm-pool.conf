[www]
; Log worker output to the container, not a file.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Recycle a worker if a request runs away.
request_terminate_timeout = 90
