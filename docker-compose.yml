# SuperNative Messenger — server stack.
#
#   cp .env.docker .env.docker.local        # set APP_KEY + passwords
#   docker compose --env-file .env.docker.local up --build -d
#
# API:    http://localhost:8080
# Reverb: ws://localhost:8081   (put behind TLS in production)
#
# The --env-file values are used both for ${...} interpolation below and,
# via `env_file:`, inside the app container.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "8080:8080"   # HTTP API (nginx)
      - "8081:8081"   # Reverb websockets
    volumes:
      - storage:/var/www/html/storage
      # Mount a Firebase service-account JSON here; point FCM_CREDENTIALS at it.
      - ./docker/firebase:/var/www/html/storage/app/firebase:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-supernative}
      MYSQL_USER: ${DB_USERNAME:-supernative}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-me-root}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

volumes:
  storage:
  dbdata:
  redisdata:
